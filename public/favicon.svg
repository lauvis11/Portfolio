<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5275FF"/>
      <stop offset="50%" stop-color="#2D4CFC"/>
      <stop offset="100%" stop-color="#1e295d"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="64" y1="38" x2="96" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6E8EFF"/>
      <stop offset="100%" stop-color="#2D4CFC"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="64" cy="64" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D4CFC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2D4CFC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>
  
  <!-- Subtle inner glow -->
  <circle cx="64" cy="64" r="48" fill="url(#centerGlow)"/>

  <!-- Monogram LV -->
  <path d="M37 38 V90 H61" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M67 38 L82 90 L97 38" fill="none" stroke="url(#vGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
